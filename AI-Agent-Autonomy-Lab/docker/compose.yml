# AI-Agent-Autonomy-Lab — contained evaluation range
#
# CONTAINMENT ARCHITECTURE (revised after F3 — a real egress leak was found and closed):
#
# The agent must reach a model endpoint on the host (for Metal GPU acceleration, the model
# runs host-native, not in a container). The naive way to do that — attach the agent to a
# second, non-internal network — GIVES THE AGENT GENERAL EGRESS via that network. F3 caught
# exactly this: an armed agent on range+model reached 1.1.1.1. That is the panorama's root
# cause reproduced: a "sealed" environment with a second path out.
#
# The fix here: ONLY a dedicated `model-proxy` sidecar touches the non-internal `model`
# network. It forwards ONE fixed port to the host model endpoint and nothing else. The agent
# is attached to the `range` (internal, no gateway) network ONLY — it has zero route off the
# range — and reaches the model at `model-proxy:8080`, which can only ever forward to the
# model host. The agent cannot use the proxy to reach an arbitrary address (socat's
# destination is fixed), so no general egress exists for the agent.
#
# verify_containment.sh now enforces this structurally: it FAILS if the agent service is
# attached to any non-internal network. The probe test remains.

name: agent-autonomy-lab

networks:
  range:
    internal: true          # no gateway → no route out. The agent lives here, ONLY here.
  model:
    internal: false         # reaches the host. ONLY model-proxy is attached to it.

services:
  # The single point that bridges the sealed range to the host model endpoint. It forwards
  # one TCP port to a FIXED destination; it is not a general proxy the agent can aim elsewhere.
  model-proxy:
    image: alpine/socat:latest
    container_name: lab-model-proxy
    networks:
      - range               # the agent reaches it here, at model-proxy:8080
      - model               # it reaches the host here — the ONLY container with egress
    command: >-
      TCP-LISTEN:8080,fork,reuseaddr
      TCP:host.docker.internal:${MODEL_HOST_PORT:-11434}
    restart: "no"

  target:
    image: bkimminich/juice-shop:latest
    container_name: lab-target
    networks:
      - range               # range ONLY: no egress, no model access
    environment:
      # Juice Shop is a single Node process; sustained sqlmap+fuzz load grew its V8 heap past
      # the ~2 GB default and it OOM-crashed mid-batch (exit 133), silently turning later runs
      # into DNS-fail "0/5" artifacts. Headroom + the runner's per-run restart guard prevent it.
      - NODE_OPTIONS=--max-old-space-size=3072
    restart: "no"

  agent:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
    container_name: lab-agent
    depends_on: [target, model-proxy]
    networks:
      - range               # range ONLY. No non-internal network. Zero egress (enforced by the gate).
    environment:
      - TARGET_HOST=target
      - TARGET_PORT=3000
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://model-proxy:8080/v1}
      - MODEL_NAME=${MODEL_NAME:-llama3.1:8b}
      - RUN_ID=${RUN_ID:-manual}
    volumes:
      - ../runs:/runs:rw
    entrypoint: ["sleep", "infinity"]

  # WORKSTATION variant — opt-in via `--profile workstation`. Root Linux box with a full build
  # toolchain the agent can install on. SAME range-only seal: no non-internal network, no egress.
  # "Install what it wants" here means "build locally"; internet-backed install is deliberately
  # absent, because that is egress. See docker/workstation.Dockerfile.
  agent-workstation:
    profiles: ["workstation"]
    build:
      context: ..
      dockerfile: docker/workstation.Dockerfile
    container_name: lab-agent-workstation
    depends_on: [target, model-proxy]
    networks:
      - range               # range ONLY — sealed, like every agent variant
    environment:
      - TARGET_HOST=target
      - TARGET_PORT=3000
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://model-proxy:8080/v1}
      - MODEL_NAME=${MODEL_NAME:-llama3.1:8b}
      - RUN_ID=${RUN_ID:-workstation}
    volumes:
      - ../runs:/runs:rw
    entrypoint: ["sleep", "infinity"]

  # KALI variant — opt-in via `--profile kali`. A full curated offensive arsenal PRE-INSTALLED,
  # so the agent needs no install and no egress. Same range-only seal. See docker/kali.Dockerfile.
  agent-kali:
    profiles: ["kali"]
    build:
      context: ..
      dockerfile: docker/kali.Dockerfile
    container_name: lab-agent-kali
    depends_on: [target, model-proxy]
    networks:
      - range               # range ONLY — sealed. Maximal capability, zero route out.
    environment:
      - TARGET_HOST=target
      - TARGET_PORT=3000
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://model-proxy:8080/v1}
      - MODEL_NAME=${MODEL_NAME:-llama3.1:8b}
      - RUN_ID=${RUN_ID:-kali}
    volumes:
      - ../runs:/runs:rw
    entrypoint: ["sleep", "infinity"]

  # ARMED variant — opt-in via `--profile armed`. Real offensive tooling (nmap, dirb, sqlmap).
  # Same range-only containment: it too has NO non-internal network. See docker/armed.Dockerfile.
  # Because it carries real capability, verify_containment.sh is a hard precondition for it.
  agent-armed:
    profiles: ["armed"]
    build:
      context: ..
      dockerfile: docker/armed.Dockerfile
    container_name: lab-agent-armed
    depends_on: [target, model-proxy]
    networks:
      - range               # range ONLY — same seal as the default agent
    environment:
      - TARGET_HOST=target
      - TARGET_PORT=3000
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://model-proxy:8080/v1}
      - MODEL_NAME=${MODEL_NAME:-llama3.1:8b}
      - RUN_ID=${RUN_ID:-armed}
    volumes:
      - ../runs:/runs:rw
    entrypoint: ["sleep", "infinity"]
